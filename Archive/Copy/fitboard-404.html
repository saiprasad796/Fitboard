<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FITBOARD — Page Not Found (404)</title>
  <meta name="description" content="This page is under construction. Let's get you back to the Fitboard PCB panelization homepage.">
  
  <!-- Google Fonts: Bebas Neue, DM Sans, Manrope -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;700&family=Manrope:wght@500;600;800&display=swap" rel="stylesheet">
  
  <style>
    /* Brand Colors & CSS Variables */
    :root {
      --primary-yellow: #FFD600;
      --nav-green: #ABD372;
      --black: #0B0B0B;
      --bg-gradient-start: #FFD600;
      --bg-gradient-end: #F2D966;
    }

    /* Reset Styles */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #1A1A1A;
      font-family: 'Manrope', sans-serif;
      color: var(--black);
      overflow-x: hidden;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
    }

    /* Frame Container (1512px by 982px, Desktop Only) */
    .frame-container {
      width: 1512px;
      height: 982px;
      position: relative;
      background: linear-gradient(180deg, var(--bg-gradient-start) 0%, var(--bg-gradient-end) 100%);
      overflow: hidden;
      box-shadow: 0 20px 80px rgba(0, 0, 0, 0.5);
    }

    /* Navbar (Height 80px, background #ABD372) */
    .navbar {
      width: 100%;
      height: 80px;
      background-color: var(--nav-green);
      position: absolute;
      top: 0;
      left: 0;
      display: flex;
      align-items: center;
      z-index: 10;
      border-bottom: 2px solid rgba(0, 0, 0, 0.05);
    }

    .nav-logo {
      position: absolute;
      left: 50px;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 40px;
      color: var(--black);
      text-decoration: none;
      letter-spacing: 0.02em;
      transition: transform 0.2s ease;
    }
    .nav-logo:hover {
      transform: scale(1.05);
    }

    .nav-contact {
      position: absolute;
      right: 50px;
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      font-weight: 500;
      color: var(--black);
      opacity: 0.8;
      text-decoration: none;
      transition: opacity 0.2s ease;
    }
    .nav-contact:hover {
      opacity: 1;
    }

    /* Subtle CSS Cloud Texture Overlay at top */
    .cloud-texture {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 450px;
      background: 
        radial-gradient(ellipse 50% 30% at 20% 15%, rgba(255, 255, 255, 0.5) 0%, rgba(255, 255, 255, 0) 70%),
        radial-gradient(ellipse 60% 40% at 80% 12%, rgba(255, 255, 255, 0.4) 0%, rgba(255, 255, 255, 0) 80%),
        radial-gradient(ellipse 40% 25% at 50% 20%, rgba(255, 255, 255, 0.45) 0%, rgba(255, 255, 255, 0) 75%);
      pointer-events: none;
      z-index: 1;
    }

    /* 404 Numbers (width 1187px centered horizontally, top ~30px) */
    .numbers-404 {
      position: absolute;
      left: 162.5px; /* (1512 - 1187) / 2 */
      top: 30px;
      width: 1187px;
      font-family: 'Manrope', sans-serif;
      font-size: 600px;
      font-weight: 800;
      line-height: 1;
      text-align: center;
      letter-spacing: -0.02em;
      background: linear-gradient(180deg, #FFFFFF 0%, #EEEC9C 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      user-select: none;
      z-index: 0;
    }

    /* Minion Image (width ~1045px centered, top 193px) */
    .minion-container {
      position: absolute;
      left: 233.5px; /* (1512 - 1045) / 2 */
      top: 193px;
      width: 1045px;
      height: 520px;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      z-index: 2;
    }

    .minion-img {
      width: auto;
      height: 480px;
      object-fit: contain;
      animation: floatMinion 3s ease-in-out infinite;
    }

    /* Shadow Ellipse (314x30px, centered, top 703px) */
    .shadow-ellipse {
      position: absolute;
      left: 599px; /* (1512 - 314) / 2 */
      top: 703px;
      width: 314px;
      height: 30px;
      background: rgba(0, 0, 0, 0.35);
      border-radius: 50%;
      filter: blur(33.9px);
      z-index: 1;
      animation: scaleShadow 3s ease-in-out infinite;
    }

    /* Bello Title (centered, top 757px) */
    .bello-title {
      position: absolute;
      left: 0;
      top: 757px;
      width: 100%;
      text-align: center;
      font-family: 'Manrope', sans-serif;
      font-size: 40px;
      font-weight: 600;
      color: #373427;
      z-index: 3;
    }

    /* Subtext (centered, top 816px) */
    .bello-subtext {
      position: absolute;
      left: 0;
      top: 816px;
      width: 100%;
      text-align: center;
      font-family: 'Manrope', sans-serif;
      font-size: 24px;
      font-weight: 500;
      color: #717171;
      z-index: 3;
    }

    /* Back to Home Button (200x46, centered top 865px) */
    .back-home-btn {
      position: absolute;
      left: 656px; /* (1512 - 200) / 2 */
      top: 865px;
      width: 200px;
      height: 46px;
      background-color: var(--black);
      border: none;
      border-radius: 80px;
      color: #FFFFFF;
      font-family: 'DM Sans', sans-serif;
      font-size: 20px;
      font-weight: 500;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      cursor: pointer;
      filter: drop-shadow(8px 8px 10.4px rgba(0, 0, 0, 0.3));
      transition: transform 0.2s ease, background-color 0.2s ease, box-shadow 0.2s ease;
      z-index: 3;
    }

    .back-home-btn:hover {
      transform: scale(1.04);
      background-color: #222;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }

    .back-home-btn:active {
      transform: scale(0.98);
    }

    /* Float & Shadow Animations */
    @keyframes floatMinion {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-10px);
      }
    }

    @keyframes scaleShadow {
      0%, 100% {
        transform: scale(1);
        opacity: 0.35;
      }
      50% {
        transform: scale(0.8);
        opacity: 0.2;
      }
    }
  </style>
</head>
<body>

  <div class="frame-container">
    
    <!-- Navbar -->
    <nav class="navbar" role="navigation">
      <a href="fitboard.html" class="nav-logo">FITBOARD</a>
      <a href="#contact" class="nav-contact">Contact</a>
    </nav>

    <!-- Cloud Texture Overlay -->
    <div class="cloud-texture"></div>

    <!-- Giant 404 Text -->
    <h1 class="numbers-404">404</h1>

    <!-- Floating Minion -->
    <div class="minion-container">
      <img src="minion.png" alt="Bello construction minion" class="minion-img" id="minionImg">
    </div>

    <!-- Blur Shadow Ellipse -->
    <div class="shadow-ellipse"></div>

    <!-- Bello Headline -->
    <h2 class="bello-title">Bello! This page is under construction</h2>

    <!-- Subtext -->
    <p class="bello-subtext">Please come again later</p>

    <!-- Back to Home Button -->
    <a href="fitboard.html" class="back-home-btn">◀ Back to Home</a>

  </div>

</body>
</html>
