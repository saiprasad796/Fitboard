<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FITBOARD — PCB Panelization Tool</title>
  <meta name="description" content="FITBOARD is the fastest PCB panelization tool ever made. Design, calculate, and export PCB panels at the speed of thought." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet" />

  <style>
    /* ─── TOKENS ─────────────────────────────────────────────── */
    :root {
      --yellow-hero-top:    #FFD600;
      --yellow-hero-bottom: #EED66B;
      --yellow-flat:        #FFD600;
      --green-nav:          #ABD372;
      --green-topbar:       #F1E6AC;
      --green-pcb-dark:     #006536;
      --green-pcb-mid:      #008C4A;
      --green-pcb-light:    #C1D99E;
      --black:              #0A0A0A;
      --white:              #FFFBFB;
      --text-muted:         rgba(0,0,0,0.5);
      --text-muted2:        rgba(0,0,0,0.6);
    }

    /* ─── RESET ──────────────────────────────────────────────── */
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--yellow-hero-top);
      overflow-x: hidden;
    }

    a { text-decoration: none; color: inherit; }
    button, a { cursor: pointer; }

    /* ─── SCROLLBAR ──────────────────────────────────────────── */
    ::-webkit-scrollbar        { width: 6px; }
    ::-webkit-scrollbar-track  { background: transparent; }
    ::-webkit-scrollbar-thumb  { background: #FFD600; border-radius: 3px; }

    /* ─── TEXT SELECTION ─────────────────────────────────────── */
    ::selection { background: #FFD600; color: #000; }

    /* ═══════════════════════════════════════════════════════════
       NAVBAR
    ══════════════════════════════════════════════════════════════ */

    /* Top bar */
    .topbar {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 15px;
      background: var(--green-topbar);
      z-index: 101;
    }

    /* Main nav */
    .navbar {
      position: fixed;
      top: 15px;
      left: 0;
      width: 100%;
      height: 80px;
      background: var(--green-nav);
      z-index: 100;
      display: flex;
      align-items: center;
      padding: 0 50px;

      /* entrance */
      animation: navSlideDown 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.1s both;
    }

    @keyframes navSlideDown {
      from { transform: translateY(-100%); }
      to   { transform: translateY(0); }
    }

    /* Logo */
    .nav-logo {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 40px;
      letter-spacing: 0.01em;
      color: #000000;
      cursor: pointer;
      user-select: none;
      flex-shrink: 0;
    }

    /* Nav links */
    .nav-links {
      display: flex;
      flex-direction: row;
      gap: 40px;
      margin-left: 80px;
      align-items: center;
    }

    .nav-link {
      position: relative;
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      font-weight: 400;
      letter-spacing: 0.01em;
      color: #0B0B0B;
      opacity: 0.8;
      cursor: pointer;
      white-space: nowrap;
      transition: opacity 0.2s ease;
    }

    .nav-link::after {
      content: '';
      position: absolute;
      bottom: -3px;
      left: 0;
      width: 0;
      height: 2px;
      background: #0B0B0B;
      transition: width 0.25s ease;
    }

    .nav-link:hover::after { width: 100%; }
    .nav-link:hover { opacity: 1; }

    /* Right side */
    .nav-right {
      margin-left: auto;
      display: flex;
      flex-direction: row;
      gap: 20px;
      align-items: center;
    }

    .nav-contact {
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      font-weight: 400;
      color: #0B0B0B;
      opacity: 0.8;
      cursor: pointer;
      transition: opacity 0.2s ease;
    }
    .nav-contact:hover { opacity: 1; }

    .nav-signin {
      width: 80px;
      height: 32px;
      background: transparent;
      border: 1px solid rgba(0,0,0,0.3);
      border-radius: 4px;
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      color: #0B0B0B;
      cursor: pointer;
      transition: background 0.2s ease;
    }
    .nav-signin:hover { background: rgba(0,0,0,0.06); }

    /* ═══════════════════════════════════════════════════════════
       HERO SECTION
    ══════════════════════════════════════════════════════════════ */
    .hero {
      width: 100vw;
      min-height: 100vh;
      background: linear-gradient(180deg, #FFD600 0%, #EED66B 100%);
      padding-top: 95px;
      display: grid;
      grid-template-columns: 45% 55%;
      align-items: center;
    }

    /* ─── LEFT COLUMN ────────────────────────────────────────── */
    .hero-left {
      padding-left: 120px;
      padding-top: 60px;
      display: flex;
      flex-direction: column;
      gap: 28px;
      justify-content: center;
    }

    /* Eyebrow */
    .hero-eyebrow {
      font-family: 'DM Sans', sans-serif;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.15em;
      color: var(--text-muted);
      text-transform: uppercase;

      animation: fadeUp 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.4s both;
    }

    /* Headline — words injected by JS */
    .hero-headline {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 88px;
      line-height: 90px;
      color: #000000;
      max-width: 370px;
      display: flex;
      flex-wrap: wrap;
      gap: 0 14px;
      column-gap: 14px;
    }

    /* Each word: clip + slide */
    .word-clip {
      display: inline-block;
      overflow: hidden;
      line-height: 1;
    }

    .word-inner {
      display: inline-block;
      animation: wordReveal 0.65s cubic-bezier(0.16, 1, 0.3, 1) both;
      /* delay set via JS inline style */
    }

    @keyframes wordReveal {
      from { transform: translateY(100%); opacity: 0; }
      to   { transform: translateY(0);    opacity: 1; }
    }

    /* Sub-tagline */
    .hero-tagline {
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      font-weight: 400;
      line-height: 22px;
      color: var(--text-muted2);

      animation: fadeUp16 0.7s cubic-bezier(0.16, 1, 0.3, 1) 1.4s both;
    }

    /* CTA Button */
    .hero-cta {
      width: 215px;
      height: 50px;
      background: var(--black);
      border: none;
      border-radius: 100px;
      font-family: 'DM Sans', sans-serif;
      font-size: 20px;
      font-weight: 500;
      color: var(--white);
      cursor: pointer;
      filter: drop-shadow(2px 6px 5px rgba(0,0,0,0.3));
      display: flex;
      align-items: center;
      justify-content: center;
      align-self: flex-start;
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);

      animation:
        fadeUp16 0.7s cubic-bezier(0.16, 1, 0.3, 1) 1.6s both,
        ctaPulse 2.5s ease-in-out 2.2s infinite;
    }

    .hero-cta:hover  { transform: scale(1.04); }
    .hero-cta:active { transform: scale(0.97); }

    @keyframes ctaPulse {
      0%,  100% { box-shadow: 0 0 0px   0px rgba(255,214,0,0);    }
      50%        { box-shadow: 0 0 18px  6px rgba(255,214,0,0.45); }
    }

    /* ─── RIGHT COLUMN ───────────────────────────────────────── */
    .hero-right {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      padding-right: 60px;
      padding-top: 40px;
    }

    /* Panel container */
    .panels-container {
      position: relative;
      width: 600px;
      height: 500px;
      flex-shrink: 0;
    }

    /* ---- Big panel (back, z-index 1) ---- */
    .panel-big {
      position: absolute;
      top: 20px;
      left: 80px;
      width: 301px;
      z-index: 1;
      filter: drop-shadow(10px 9px 7.2px rgba(0,0,0,0.25));
      transform-origin: center;

      animation:
        panelFlyIn 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.7s both,
        floatA 4s ease-in-out 2s infinite;
    }

    /* ---- Medium panel (middle, z-index 2) ---- */
    .panel-med {
      position: absolute;
      top: 120px;
      left: 20px;
      width: 260px;
      z-index: 2;
      filter: drop-shadow(8px 8px 6px rgba(0,0,0,0.22));

      animation:
        panelFlyIn 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.9s both,
        floatB 4.5s ease-in-out 2.3s infinite;
    }

    /* ---- Small panel (front, z-index 3) ---- */
    .panel-small {
      position: absolute;
      top: 200px;
      left: 300px;
      width: 210px;
      z-index: 3;
      filter: drop-shadow(6px 6px 5px rgba(0,0,0,0.2));

      animation:
        panelFlyIn 0.9s cubic-bezier(0.16, 1, 0.3, 1) 1.1s both,
        floatC 3.8s ease-in-out 2.6s infinite;
    }

    /* Panel entrance */
    @keyframes panelFlyIn {
      from { transform: translateX(120px); opacity: 0; }
      to   { transform: translateX(0);     opacity: 1; }
    }

    /* Panel float idles */
    @keyframes floatA {
      0%, 100% { transform: translateY(0px);  }
      50%       { transform: translateY(-8px); }
    }
    @keyframes floatB {
      0%, 100% { transform: translateY(0px);  }
      50%       { transform: translateY(-6px); }
    }
    @keyframes floatC {
      0%, 100% { transform: translateY(0px);   }
      50%       { transform: translateY(-10px); }
    }

    /* ─── SHARED ENTRANCE KEYFRAMES ──────────────────────────── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0);    }
    }
    @keyframes fadeUp16 {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0);    }
    }

  </style>
</head>
<body>

  <!-- ═══════════════════════════════════════════════════════════
       NAVBAR
  ════════════════════════════════════════════════════════════════ -->
  <div class="topbar" aria-hidden="true"></div>

  <nav class="navbar" role="navigation" aria-label="Main navigation">
    <span class="nav-logo" role="img" aria-label="FITBOARD logo">FITBOARD</span>

    <div class="nav-links">
      <a href="#how-it-works" class="nav-link" id="nav-how">How it works</a>
      <a href="#calculators"   class="nav-link" id="nav-calc">Calculators ▾</a>
      <a href="#about"         class="nav-link" id="nav-about">About</a>
    </div>

    <div class="nav-right">
      <a href="#contact" class="nav-contact" id="nav-contact">Contact</a>
      <button class="nav-signin" id="nav-signin" type="button">Sign In</button>
    </div>
  </nav>

  <!-- ═══════════════════════════════════════════════════════════
       HERO SECTION
  ════════════════════════════════════════════════════════════════ -->
  <section class="hero" id="hero" aria-label="Hero">

    <!-- LEFT -->
    <div class="hero-left">
      <p class="hero-eyebrow" id="hero-eyebrow">PCB Panelization Tool</p>

      <h1 class="hero-headline" id="hero-headline" aria-label="PCB Panelization at the speed of thought.">
        <!-- Words injected by JS -->
      </h1>

      <p class="hero-tagline" id="hero-tagline">
        Everything you need.<br>Nothing you don't.
      </p>

      <button class="hero-cta" id="hero-cta" type="button">
        Start Panelizing ▶
      </button>
    </div>

    <!-- RIGHT -->
    <div class="hero-right">
      <div class="panels-container" aria-label="PCB panel preview">
        <!-- Big panel — back layer -->
        <img
          class="panel-big"
          src="Assets/Big Panel.svg"
          alt="Large PCB panel"
          draggable="false"
        />
        <!-- Medium panel — middle layer -->
        <img
          class="panel-med"
          src="Assets/Big Panel.svg"
          alt="Medium PCB panel"
          draggable="false"
        />
        <!-- Small panel — front layer -->
        <img
          class="panel-small"
          src="Assets/Small Panel.svg"
          alt="Small PCB panel"
          draggable="false"
        />
      </div>
    </div>

  </section>

  <!-- ═══════════════════════════════════════════════════════════
       INLINE JAVASCRIPT
  ════════════════════════════════════════════════════════════════ -->
  <script>
    document.addEventListener('DOMContentLoaded', function () {

      /* ── Word-by-word headline split ─────────────────────────── */
      var headlineEl   = document.getElementById('hero-headline');
      var headlineText = 'PCB PANELIZATION AT THE SPEED OF THOUGHT.';
      var words        = headlineText.split(' ');
      var baseDelay    = 0.5;   // seconds
      var stagger      = 0.08;  // 80ms per word

      headlineEl.innerHTML = ''; // clear

      words.forEach(function (word, i) {
        /* Outer clip container */
        var clip = document.createElement('span');
        clip.className = 'word-clip';
        clip.setAttribute('aria-hidden', 'true');

        /* Inner animated span */
        var inner = document.createElement('span');
        inner.className = 'word-inner';
        inner.textContent = word;
        inner.style.animationDelay = (baseDelay + i * stagger) + 's';

        clip.appendChild(inner);
        headlineEl.appendChild(clip);

        /* Add a non-breaking space between words for layout,
           but NOT after the last word */
        if (i < words.length - 1) {
          headlineEl.appendChild(document.createTextNode('\u00A0'));
        }
      });

    });
  </script>

</body>
</html>
